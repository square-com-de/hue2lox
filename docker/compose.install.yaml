# Fresh Linux installation: host networking enables LAN discovery.
# Existing prototype installations keep their own compose.yaml.
name: "${COMPOSE_PROJECT_NAME:-hue2lox-test}"
services:
  hue2lox:
    container_name: "${HUE2LOX_CONTAINER_NAME:?Run prepare-install first}"
    build:
      context: .
      dockerfile: docker/Dockerfile.status
      args:
        REGISTRY_SOURCE: install/registry.empty.json
    restart: unless-stopped
    network_mode: host
    environment:
      BIND_HOST: "${HUE2LOX_BIND_IP:?Run prepare-install first}"
      PORT: "${HUE2LOX_PORT:-8443}"
      HUE_PUBLIC_URL: "${HUE_PUBLIC_URL:?Run prepare-install first}"
      HUE_LEGACY_ENABLED: "0"
      HUE_STATE_DIR: /data
      HUE_REGISTRY_FILE: /data/registry.json
      HUE_ADMIN_AUTH_FILE: /data/admin_auth.json
      HUE_CONTROL_TOKEN_FILE: /run/secrets/control_token
      HUE_WRITES_ENABLED: "${HUE_WRITES_ENABLED:-0}"
      HUE_COLOR_ENABLED: "${HUE_COLOR_ENABLED:-0}"
      HUE_WHITE_ENABLED: "${HUE_WHITE_ENABLED:-0}"
      TLS_CERT: /certs/server.crt
      TLS_KEY: /certs/server.key
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/data:rw
      - ./certs:/certs:ro
      - ./secrets/control_token:/run/secrets/control_token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,ssl,urllib.request; c=ssl.create_default_context(cafile='/certs/server.crt'); r=urllib.request.urlopen('https://'+os.environ['BIND_HOST']+':'+os.environ['PORT']+'/health',context=c,timeout=3); assert r.status==200 and r.read()==b'{\"status\":\"ok\"}'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
