services:
  hue2lox:
    build:
      context: .
      dockerfile: docker/Dockerfile.status
    restart: unless-stopped
    ports:
      - "${HUE2LOX_BIND_IP:-127.0.0.1}:8443:8443"
    environment:
      PORT: "8443"
      HUE_PUBLIC_URL: "${HUE_PUBLIC_URL:-https://localhost:8443}"
      HUE_STATE_DIR: /data
      HUE_REGISTRY_FILE: /data/registry.json
      HUE_ADMIN_AUTH_FILE: /data/admin_auth.json
      HUE_WRITES_ENABLED: "0"
      HUE_COLOR_ENABLED: "0"
      HUE_WHITE_ENABLED: "0"
      TLS_CERT: /certs/server.crt
      TLS_KEY: /certs/server.key
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/data:rw
      - ./certs:/certs:ro
      - ./secrets/hue_key:/run/secrets/hue_key:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; c=ssl.create_default_context(cafile='/certs/server.crt'); r=urllib.request.urlopen('https://127.0.0.1:8443/health',context=c,timeout=3); assert r.status==200 and r.read()==b'{\"status\":\"ok\"}'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
