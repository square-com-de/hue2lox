name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  history-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan current files and all branch/tag history with pinned Gitleaks
        run: CI=true sh scripts/check-history-secrets.sh
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python scripts/check-quality.py
      - run: python -m unittest discover -s tests -t . -p 'test_*.py'
      - run: python scripts/smoke-install.py
      - run: python scripts/smoke-native.py
      - name: Test unpublished source and native release packages
        run: python scripts/check-release-packages.py
      - name: Check generated translations and tutorials
        run: |
          python tools/build_discovery_help.py
          python tools/build_locales.py
          python tools/build_tutorial.py
          python tools/build_tutorial.py --english
          git diff --exit-code -- web/discovery-help.js web/locales web/tutorial.html web/tutorial-en.html
      - name: Scan source for secrets (private report, no matched text in logs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: json
          output: ${{ runner.temp }}/hue2lox-secret-report.json
          exit-code: '1'
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test isolated empty installation
        run: sudo env CI=true sh scripts/ci-container.sh
      - name: Test installer with prebuilt release-layout images
        run: sudo env CI=true sh scripts/ci-installer-image.sh
      - name: Test cold Docker updates and exact-image rollback
        run: sudo env CI=true python3 scripts/check-docker-update.py
      - name: Test Docker from unpublished release source ZIP
        run: sudo env CI=true python3 scripts/check-release-packages.py --docker
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: hue2lox-ci:check
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: ${{ runner.temp }}/hue2lox-image-report.json
          exit-code: '1'
      - name: Preserve image vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-vulnerability-report
          path: ${{ runner.temp }}/hue2lox-image-report.json
          if-no-files-found: warn
          retention-days: 90
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    name: Native ${{ matrix.os }} amd64 (isolated systemd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native packages and test offline lifecycle
        run: sudo env CI=true sh scripts/ci-native.sh "${{ matrix.os }}"
  windows-discovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test local discovery parser on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/discovery-windows.ps1
