name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python scripts/check-quality.py
      - run: python -m unittest discover -s tests -t . -p 'test_*.py'
      - run: python scripts/smoke-install.py
      - name: Check generated translations and tutorials
        run: |
          python tools/build_locales.py
          python tools/build_tutorial.py
          python tools/build_tutorial.py --english
          git diff --exit-code -- web/locales web/tutorial.html web/tutorial-en.html
      - name: Scan source for secrets (private report, no matched text in logs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: json
          output: ${{ runner.temp }}/hue2lox-secret-report.json
          exit-code: '1'
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test isolated empty installation
        run: sudo env CI=true sh scripts/ci-container.sh
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: hue2lox-ci:check
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: ${{ runner.temp }}/hue2lox-image-report.json
          exit-code: '1'
      - name: Preserve image vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-vulnerability-report
          path: ${{ runner.temp }}/hue2lox-image-report.json
          if-no-files-found: warn
          retention-days: 90
