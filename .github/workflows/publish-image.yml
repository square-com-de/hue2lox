name: Prepare container images
# No registry login or push: distribution remains blocked by RELEASE.md.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: hue2lox-candidate:inventory
      - name: Inventory the exact image without network or application startup
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir evidence
          printf '%s\n' "$SOURCE_COMMIT" > evidence/source-commit.txt
          docker image inspect hue2lox-candidate:inventory > evidence/image.json
          docker run --rm -i --network none --read-only --tmpfs /data \
            --platform "linux/$ARCH" --entrypoint python hue2lox-candidate:inventory \
            -B - < scripts/image-inventory.py > evidence/inventory.json
          cp Dockerfile evidence/
          cp compliance/base-image.json evidence/
          sha256sum evidence/* > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-evidence-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
  source-materials:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-evidence-amd64
          path: evidence/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-evidence-arm64
          path: evidence/arm64
      - name: Assemble hash-checked sources and compare both built images
        run: python3 scripts/build-source-bundle.py --output /tmp/hue2lox-base-sources --evidence evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-source-materials
          path: |
            /tmp/hue2lox-base-sources.tar.gz
            /tmp/hue2lox-base-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
