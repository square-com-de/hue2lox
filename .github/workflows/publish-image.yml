name: Prepare container images
# Read-only preparation. Only release-image.yml may publish these exact candidates.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Select release identity only for an exact tag checkout
        id: build-identity
        env:
          BUILD_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          version=""
          case "$BUILD_REF" in
            refs/tags/v*)
              test "$(git rev-parse "$BUILD_REF^{commit}")" = "$SOURCE_COMMIT"
              version="${BUILD_REF#refs/tags/v}"
              ;;
          esac
          python3 src/release_version.py --write-build /tmp/hue2lox-build-info.json \
            --version "$version" --revision "$SOURCE_COMMIT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: hue2lox-candidate:inventory
          build-args: |
            HUE2LOX_BUILD_VERSION=${{ steps.build-identity.outputs.version }}
            HUE2LOX_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/GHCR-RELEASE.md
      - name: Inventory the exact image without network or application startup
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir evidence
          printf '%s\n' "$SOURCE_COMMIT" > evidence/source-commit.txt
          docker image inspect hue2lox-candidate:inventory > evidence/image.json
          docker run --rm -i --network none --read-only --tmpfs /data \
            --platform "linux/$ARCH" --entrypoint python hue2lox-candidate:inventory \
            -B - < scripts/image-inventory.py > evidence/inventory.json
          cp Dockerfile evidence/
          cp compliance/base-image.json evidence/
      - name: Verify immutable in-image build identity
        env:
          BUILD_VERSION: ${{ steps.build-identity.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --entrypoint python \
            -e EXPECTED_VERSION="$BUILD_VERSION" -e EXPECTED_REVISION="$SOURCE_COMMIT" \
            hue2lox-candidate:inventory -c 'import json,os,release_version; from pathlib import Path; expected=release_version.build_identity(os.environ["EXPECTED_VERSION"],os.environ["EXPECTED_REVISION"]); assert json.loads(Path("/app/build-info.json").read_text())==expected; assert release_version.installed_version()==("Hue2Lox "+expected["version"] if expected["kind"]=="release" else "Hue2Lox · Entwicklungsbuild")'
      - name: Boot the exact platform candidate and check HTTP health
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          container=$(docker run -d --platform "linux/$ARCH" hue2lox-candidate:inventory)
          trap 'docker rm -fv "$container" >/dev/null' EXIT
          healthy=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8443/health", timeout=2).status == 200'; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
      - name: Scan the exact platform image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: hue2lox-candidate:inventory
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: evidence/vulnerabilities.json
          exit-code: '1'
      - name: Produce platform SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: hue2lox-candidate:inventory
          format: spdx-json
          output: evidence/sbom.spdx.json
      - name: Seal evidence and retain release candidate
        run: |
          (cd evidence && sha256sum * > SHA256SUMS.txt)
          docker save hue2lox-candidate:inventory | gzip > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.arch }}
          path: |
            image.tar.gz
            image.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
  source-materials:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-evidence-amd64
          path: evidence/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-evidence-arm64
          path: evidence/arm64
      - name: Assemble hash-checked sources and compare both built images
        run: python3 scripts/build-source-bundle.py --output /tmp/hue2lox-base-sources --evidence evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-source-materials
          path: |
            /tmp/hue2lox-base-sources.tar.gz
            /tmp/hue2lox-base-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
